repos:
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: Lint all Git-tracked Markdown files (excluding .gitignore)
        entry: bash scripts/lint-markdown.sh
        language: system
        types: [markdown]
        pass_filenames: false
      - id: cargo-check-and-test
        name: Run Rust workspace formatting, clippy, and proof tests
        entry: bash scripts/check.sh
        language: system
        types: [rust]
        pass_filenames: false
