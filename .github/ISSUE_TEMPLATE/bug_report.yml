name: Bug Report / 不具合報告
description: Report a bug or unexpected behavior in veil-mesh-consensus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 現象と再現手順 (Description & Steps to Reproduce)
      description: どのような環境・手順で問題が発生したか記載してください（秘密鍵や実サービスの機密ログは含めないでください）。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 実行環境 (OS / Kernel / Rust Version)
      placeholder: "例: Ubuntu 24.04 (Kernel 6.8 x86_64) / macOS ARM64"
    validations:
      required: true
